    <!-- Thème de l'admin (classe admin-ui, LAB-363) et mode sombre (classe dark, LAB-340), posés avant le
         premier rendu : même règle que src/lib/theme.js (alignement vérifié par src/lib/theme.test.js). -->
    <script id="admin-theme-boot">
      (function () {
        try {
          var p = location.pathname.replace(/\/+$/, '') || '/';
          var excluded = ['/admin/login', '/admin/nouveau-mot-de-passe'];
          var prefixes = ['/admin/demandes/'];
          var admin = p === '/admin' || p.indexOf('/admin/') === 0;
          if (/^\/associer$/.test(p) || (admin && !/^\/admin\/demandes\/[^/]+\/preuve$/.test(p))) {
            document.documentElement.classList.add('admin-ui');
          }
          if (!admin) return;
          if (excluded.indexOf(p) !== -1) return;
          if (/^\/admin\/(templates\/(new|[^/]+\/edit)|ecrans-borne\/[^/]+)$/.test(p)) return;
          var store = null;
          try { store = window.localStorage; } catch (e) { store = null; }
          for (var i = 0; i < prefixes.length; i++) {
            if (p.indexOf(prefixes[i]) !== 0) continue;
            // Demande ouverte avec une session : le menu va s'afficher, on pose le thème tout de suite.
            if (!/^\/admin\/demandes\/[^/]+$/.test(p)) return;
            var session = false;
            try {
              for (var k = 0; k < store.length; k++) if (/^sb-.+-auth-token$/.test(String(store.key(k)))) session = true;
            } catch (e) { session = false; }
            if (!session) return;
          }
          var choice = null;
          try { choice = store.getItem('pola-admin-theme'); } catch (e) { choice = null; }
          var dark = choice === 'dark';
          if (choice !== 'dark' && choice !== 'light') {
            dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          }
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* thème clair */ }
      })();
    </script>
