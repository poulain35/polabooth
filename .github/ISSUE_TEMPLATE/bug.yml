name: Signaler un bug
description: Quelque chose ne marche pas comme prévu dans le SaaS ou sur la borne.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce bug. Retirez toute donnée personnelle avant d'envoyer : noms des invités, emails, photos de clients, clés et mots de passe.
  - type: dropdown
    id: part
    attributes:
      label: Partie concernée
      options:
        - SaaS (administration, éditeur, pages client)
        - Borne (PolaKiosk)
        - Installation (script, guides)
        - Je ne sais pas
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit ou date de synchronisation du SaaS, version de la borne (en haut de l'écran Administration).
      placeholder: "ex. Synchronisation 2026-11-18, borne 1.0.19"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Ce que vous avez fait
      description: Les étapes pour reproduire le problème.
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Ce qui s'est passé
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce que vous attendiez
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Navigateur, version de Windows, appareil photo, imprimante, hébergement (Supabase, stockage).
  - type: textarea
    id: logs
    attributes:
      label: Messages d'erreur ou journaux
      description: Console du navigateur, journaux de la borne. Collés tels quels, sans données personnelles.
      render: text
